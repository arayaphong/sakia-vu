<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16-Band Spectrum Meter</title>
<style>
  :root{
    --bg:#0b0d10;
    --panel:#14181d;
    --panel-edge:#272d35;
    --ink:#e8edf2;
    --muted:#6b7682;
    --green:#34e07a;
    --amber:#ffc24b;
    --red:#ff4d52;
    --grid:#1c2127;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #161b21 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .console{
    width:100%;
    max-width:860px;
    background:linear-gradient(180deg,#181d23,#10141a);
    border:1px solid var(--panel-edge);
    border-radius:18px;
    padding:22px 22px 18px;
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,.8),
      inset 0 1px 0 rgba(255,255,255,.04);
  }
  .head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
  }
  .title{
    font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    font-size:13px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .title b{color:var(--ink);font-weight:600}
  .status{
    font-family:ui-monospace,Menlo,monospace;
    font-size:11px;
    letter-spacing:.12em;
    color:var(--muted);
    text-transform:uppercase;
    display:flex;align-items:center;gap:7px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#3a424c;transition:.2s}
  .dot.live{background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.35}}

  .screen{
    position:relative;
    background:#070a0d;
    border:1px solid #000;
    border-radius:12px;
    padding:14px 10px 8px;
    box-shadow:inset 0 2px 24px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.02);
  }
  canvas{display:block;width:100%;height:auto;border-radius:6px}

  .controls{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  button{
    font-family:ui-monospace,Menlo,monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink);
    background:linear-gradient(180deg,#222a31,#171c22);
    border:1px solid var(--panel-edge);
    border-radius:9px;
    padding:11px 18px;
    cursor:pointer;
    transition:.15s;
  }
  button:hover{border-color:#3b4550;transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.on{
    color:#08110b;
    background:linear-gradient(180deg,#46f088,#2bc466);
    border-color:#2bc466;
    box-shadow:0 0 18px -4px var(--green);
  }
  button:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  .gain{display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
  .gain label{
    font-family:ui-monospace,Menlo,monospace;font-size:11px;
    letter-spacing:.12em;color:var(--muted);text-transform:uppercase;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;
    background:#2a3138;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--ink);border:3px solid #11151a;box-shadow:0 0 0 1px #000;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:var(--ink);
    border:3px solid #11151a;
  }
  .hint{
    margin-top:14px;font-size:12px;line-height:1.6;color:var(--muted);
    font-family:ui-monospace,Menlo,monospace;
  }
  @media (max-width:520px){
    .controls{flex-direction:column;align-items:stretch}
    button{width:100%}
  }
</style>
</head>
<body>
  <div class="console">
    <div class="head">
      <div class="title"><b>SPECTRUM</b> · 16-BAND METER</div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">หยุด</span></div>
    </div>

    <div class="screen">
      <canvas id="cv" width="1640" height="560"></canvas>
    </div>

    <div class="controls">
      <button id="toggle">เริ่มฟังไมโครโฟน</button>
      <div class="gain">
        <label for="gain">Gain</label>
        <input type="range" id="gain" min="0.5" max="6" step="0.1" value="1.8">
      </div>
      <button id="peak" class="on">Peak Hold</button>
    </div>

    <p class="hint" id="hint">กดปุ่มเริ่ม แล้วอนุญาตให้เข้าถึงไมโครโฟน · แต่ละแท่งคือย่านความถี่ 30 Hz → 16 kHz (สเกลลอการิทึม)</p>
  </div>

<script>
const NUM_BANDS = 16;
const SEGMENTS  = 28;          // จำนวน LED ต่อแท่ง
const FMIN = 30, FMAX = 16000; // ช่วงความถี่ที่แสดง

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const toggleBtn = document.getElementById('toggle');
const peakBtn = document.getElementById('peak');
const gainEl = document.getElementById('gain');
const dot = document.getElementById('dot');
const statusTxt = document.getElementById('statusTxt');
const hint = document.getElementById('hint');

let audioCtx, analyser, source, stream, freqData;
let running = false, peakHold = true, raf;

// ค่าระดับและ peak ของแต่ละแท่ง (0..1)
const levels = new Float32Array(NUM_BANDS);
const peaks  = new Float32Array(NUM_BANDS);
const peakVel = new Float32Array(NUM_BANDS);

// ป้ายความถี่ใต้แต่ละแท่ง
const bandLabels = [];
let bandEdges = [];

function buildBandEdges(sampleRate, binCount){
  // ขอบย่านความถี่แบบลอการิทึม 16 ย่าน + แปลงเป็น index ของ FFT bin
  bandEdges = [];
  bandLabels.length = 0;
  const hzPerBin = (sampleRate/2) / binCount;
  for(let i=0;i<=NUM_BANDS;i++){
    const f = FMIN * Math.pow(FMAX/FMIN, i/NUM_BANDS);
    bandEdges.push(Math.round(f / hzPerBin));
    if(i<NUM_BANDS){
      const fc = FMIN * Math.pow(FMAX/FMIN, (i+0.5)/NUM_BANDS);
      bandLabels.push(fc>=1000 ? (fc/1000).toFixed(fc>=10000?0:1)+'k' : Math.round(fc).toString());
    }
  }
}

async function start(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    hint.textContent = 'เข้าถึงไมโครโฟนไม่ได้: '+e.message+' · หากรันในกรอบพรีวิว ลองดาวน์โหลดไฟล์ไปเปิดในเบราว์เซอร์โดยตรง';
    hint.style.color = 'var(--red)';
    return;
  }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0.6;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  source.connect(analyser);

  buildBandEdges(audioCtx.sampleRate, analyser.frequencyBinCount);

  running = true;
  toggleBtn.textContent = 'หยุด';
  toggleBtn.classList.add('on');
  dot.classList.add('live');
  statusTxt.textContent = 'กำลังฟัง';
  hint.style.color = 'var(--muted)';
  hint.textContent = 'แต่ละแท่งคือย่านความถี่ 30 Hz → 16 kHz · ปรับ Gain เพื่อเพิ่ม/ลดความไว';
  loop();
}

function stop(){
  running = false;
  if(raf) cancelAnimationFrame(raf);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(audioCtx) audioCtx.close();
  toggleBtn.textContent = 'เริ่มฟังไมโครโฟน';
  toggleBtn.classList.remove('on');
  dot.classList.remove('live');
  statusTxt.textContent = 'หยุด';
  levels.fill(0); peaks.fill(0);
  draw();
}

function loop(){
  analyser.getByteFrequencyData(freqData);
  const gain = parseFloat(gainEl.value);

  for(let b=0;b<NUM_BANDS;b++){
    let lo = bandEdges[b], hi = Math.max(bandEdges[b+1], lo+1);
    let sum=0, n=0;
    for(let k=lo;k<hi && k<freqData.length;k++){ sum+=freqData[k]; n++; }
    let v = (n? sum/n : 0)/255;       // 0..1
    v = Math.min(1, v*gain);

    // attack เร็ว, release ช้า (ให้ความรู้สึกแบบมิเตอร์อนาล็อก)
    if(v>levels[b]) levels[b] = v;
    else levels[b] += (v-levels[b])*0.22;

    // peak hold ตกลงด้วยแรงโน้มถ่วง
    if(levels[b]>=peaks[b]){ peaks[b]=levels[b]; peakVel[b]=0; }
    else{ peakVel[b]+=0.0009; peaks[b]=Math.max(levels[b], peaks[b]-peakVel[b]); }
  }
  draw();
  raf = requestAnimationFrame(loop);
}

function segColor(ratio){
  if(ratio>0.82) return '#ff4d52';
  if(ratio>0.6)  return '#ffc24b';
  return '#34e07a';
}

function draw(){
  const W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);

  const padX=24, padTop=14, padBottom=46;
  const usableW = W - padX*2;
  const usableH = H - padTop - padBottom;
  const colW = usableW / NUM_BANDS;
  const barW = colW*0.62;
  const gapSeg = 4;
  const segH = (usableH - (SEGMENTS-1)*gapSeg) / SEGMENTS;

  for(let b=0;b<NUM_BANDS;b++){
    const x = padX + b*colW + (colW-barW)/2;
    const lit = Math.round(levels[b]*SEGMENTS);
    const peakSeg = Math.round(peaks[b]*SEGMENTS);

    for(let s=0;s<SEGMENTS;s++){
      const ratio = (s+1)/SEGMENTS;
      const y = padTop + (SEGMENTS-1-s)*(segH+gapSeg);
      const isLit = s<lit;
      const isPeak = peakHold && (s===peakSeg-1) && peakSeg>0;

      if(isLit || isPeak){
        ctx.fillStyle = segColor(ratio);
        ctx.shadowColor = segColor(ratio);
        ctx.shadowBlur = isPeak? 14 : 8;
        ctx.globalAlpha = isPeak? 1 : 0.95;
      }else{
        ctx.fillStyle = '#161b20';
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
      roundRect(x,y,barW,segH,2);
      ctx.fill();
    }
    ctx.shadowBlur=0; ctx.globalAlpha=1;

    // ป้ายความถี่
    ctx.fillStyle = '#6b7682';
    ctx.font = '600 22px ui-monospace, Menlo, monospace';
    ctx.textAlign='center';
    ctx.fillText(bandLabels[b]||'', x+barW/2, H-16);
  }

  // หน่วย Hz มุมขวาล่าง
  ctx.fillStyle='#3a424c';
  ctx.font='600 20px ui-monospace, Menlo, monospace';
  ctx.textAlign='right';
  ctx.fillText('Hz', W-padX, H-16);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

toggleBtn.onclick = ()=> running? stop() : start();
peakBtn.onclick = ()=>{
  peakHold = !peakHold;
  peakBtn.classList.toggle('on', peakHold);
  if(!peakHold) peaks.fill(0);
};

// วาดสถานะว่างเริ่มต้น
buildBandEdges(48000, 2048);
draw();
</script>
</body>
</html>
