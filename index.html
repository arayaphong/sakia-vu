<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SakiaVU — Web</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <div id="head">
    <span id="title">SPECTRUM — 16-BAND METER</span>
    <span id="status" class="stopped">● STOPPED</span>
  </div>

  <div class="screen"><canvas id="meter"></canvas></div>

  <div class="row" id="controls">
    <button id="listen">▶ Listen</button>
    <select id="mode" title="Capture mode">
      <option value="mic">Mic</option>
      <option value="tab">Tab audio</option>
    </select>
    <select id="device" title="Input device"></select>
    <label class="gain">GAIN
      <input type="range" id="gain" min="0.1" max="1.5" step="0.1" value="1.0">
      <span id="gainVal">1.0x</span>
    </label>
    <button id="peak" class="toggle active">Peak Hold</button>
    <button id="physics" class="toggle">Physics</button>
  </div>

  <div class="row hidden" id="physicsControls">
    <button id="dropBall">Drop Ball</button>
    <button id="dropBox">Drop Box</button>
    <button id="clearObjs">Clear</button>
    <button id="lowGrav" class="toggle">Low Gravity</button>
    <span id="spawnHint">Click canvas: ball · right-click: box</span>
  </div>

  <div class="note">
    Tab audio uses the browser's share picker (Chromium: any tab/screen with audio;
    Firefox: tab audio only). Mic and tab capture require this page to be served
    over http(s) or localhost.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"
        integrity="sha512-6+7rTBmR6pRFe9fa0vCFjFaHZj/XYa7774bEBzRtxgdpIJOS++R3cKd6Prg/eJmxtsJotd8KAg4g57uuVQsZKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="js/main.mjs"></script>
</body>
</html>
